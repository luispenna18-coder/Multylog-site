<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="white"/>

  <!-- Barra vermelha superior -->
  <rect x="4" y="4" width="92" height="7" fill="#CC0000"/>

  <!-- Barra escura inferior -->
  <rect x="4" y="89" width="92" height="7" fill="#1C1C1E"/>

  <!-- Seta vermelha principal (aponta para cima) -->
  <polygon points="37,12 11,50 23,50 23,89 51,89 51,50 63,50" fill="#CC0000"/>

  <!-- Faixa branca diagonal no vermelho (cria efeito de segunda seta) -->
  <polygon points="25,50 33,50 21,89 13,89" fill="white"/>

  <!-- Seta escura principal (aponta para baixo) -->
  <polygon points="63,88 37,50 49,50 49,11 77,11 77,50 89,50" fill="#1C1C1E"/>

  <!-- Faixa branca diagonal no escuro (cria efeito de segunda seta) -->
  <polygon points="67,11 75,11 80,89 72,89" fill="white"/>
</svg>
