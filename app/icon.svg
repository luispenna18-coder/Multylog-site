<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Barra vermelha superior -->
  <rect x="0" y="0" width="64" height="8" fill="#CC0000"/>

  <!-- Seta vermelha 1 (esquerda) -->
  <polygon points="1,84 15,10 29,84" fill="#CC0000"/>
  <!-- corte branco diagonal -->
  <polygon points="23,50 29,84 21,84" fill="white"/>

  <!-- Seta vermelha 2 -->
  <polygon points="14,84 29,8 44,84" fill="#CC0000"/>
  <!-- corte branco diagonal -->
  <polygon points="37,49 44,84 35,84" fill="white"/>

  <!-- Seta escura para baixo -->
  <polygon points="36,10 57,84 78,10" fill="#2D2D2D"/>
  <!-- corte branco diagonal -->
  <polygon points="36,10 47,10 49,46" fill="white"/>

  <!-- Barra escura inferior -->
  <rect x="0" y="91" width="100" height="9" fill="#2D2D2D"/>
</svg>
